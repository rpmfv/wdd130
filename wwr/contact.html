<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
        content="Get in touch with White Water Rafting Company to ask a question, book a trip, or share a suggestion.">
    <meta name="author" content="Enow Tabot">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="contact-info">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </address>
        </div>

        <div class="contact-main">
            <div class="map">
                <img src="images/map.png" alt="Map showing the location of White Water Rafting Company in Kolob">
            </div>

            <form action="#" method="post">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="radio-options">
                        <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                    </div>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter" checked>
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="staff">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee3_300.jpg" alt="Portrait of our lead river guide">
                <figcaption>Our Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee1_300.jpg" alt="Portrait of our Ceo">
                <figcaption>Our CEO</figcaption>
            </figure>
            <figure>
                <img src="images/employee2_300.jpg" alt="Portrait of our safety instructor">
                <figcaption>Safety Instructor</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Enow Tabot</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
